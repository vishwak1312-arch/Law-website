<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F294A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E096" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997722" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Outer Background Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.5" />

  <!-- Scales of Justice Emblem -->
  <g transform="translate(256, 256)">
    <!-- Base -->
    <path d="M -70 170 L 70 170 L 50 145 L -50 145 Z" fill="url(#goldGrad)" />
    <rect x="-90" y="170" width="180" height="16" rx="6" fill="url(#goldGrad)" />

    <!-- Central Column -->
    <rect x="-10" y="-130" width="20" height="275" rx="5" fill="url(#goldGrad)" />

    <!-- Top Finial / Ornament -->
    <circle cx="0" cy="-145" r="18" fill="url(#goldGrad)" />
    <path d="M 0 -170 L 8 -150 L -8 -150 Z" fill="url(#goldAccent)" />

    <!-- Main Horizontal Beam -->
    <path d="M -170 -85 C -80 -105 80 -105 170 -85 L 170 -70 C 80 -90 -80 -90 -170 -70 Z" fill="url(#goldGrad)" />
    <circle cx="-165" cy="-77" r="10" fill="url(#goldGrad)" />
    <circle cx="165" cy="-77" r="10" fill="url(#goldGrad)" />

    <!-- Left Hanging Scale -->
    <path d="M -165 -70 L -215 45 M -165 -70 L -115 45" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M -225 45 C -225 95 -105 95 -105 45 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M -220 48 C -220 70 -110 70 -110 48 Z" fill="url(#goldAccent)" opacity="0.4" />

    <!-- Right Hanging Scale -->
    <path d="M 165 -70 L 115 45 M 165 -70 L 215 45" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 105 45 C 105 95 225 95 225 45 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 110 48 C 110 70 220 70 220 48 Z" fill="url(#goldAccent)" opacity="0.4" />
  </g>
</svg>
